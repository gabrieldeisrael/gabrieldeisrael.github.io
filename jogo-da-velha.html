<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha Impossível</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Trebuchet+MS&display=swap');

  :root{
    --xp-blue-dark:#0a246a;
    --xp-blue-mid:#3a6ea5;
    --titlebar-1:#0058e6;
    --titlebar-2:#3a93ff;
    --titlebar-3:#0058e6;
    --window-bg:#ece9d8;
    --panel-bg:#f5f4ea;
    --field-bg:#ffffff;
    --border-dark:#8a8a6f;
    --border-darker:#6b6b52;
    --btn-face:#ece9d8;
    --xp-green:#2ea52c;
    --tooltip-bg:#ffffe1;
    --x-color:#d21e1e;
    --o-color:#0054e3;
    --desktop-teal:#1a6b7c;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100vh;
    font-family: Tahoma, "Trebuchet MS", Verdana, sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, #3a9dcf 0%, var(--desktop-teal) 55%, #0e4a57 100%);
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 12px;
    font-size:12px;
  }

  .stage{
    width:100%;
    max-width:560px;
  }

  /* ===== XP WINDOW ===== */
  .xp-window{
    background:var(--window-bg);
    border:1px solid var(--xp-blue-dark);
    border-radius:8px 8px 3px 3px;
    box-shadow:
      0 0 0 1px #dcdad0 inset,
      6px 6px 22px rgba(0,0,0,.45);
    overflow:hidden;
  }

  .titlebar{
    background:linear-gradient(180deg, #2f7cea 0%, #1a5fd4 4%, #0f4dc9 8%, var(--titlebar-2) 18%, var(--titlebar-1) 46%, #1958d6 82%, #0b3fae 94%, #0a3aa0 100%);
    padding:3px 3px 3px 6px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:28px;
  }

  .titlebar-left{
    display:flex;
    align-items:center;
    gap:6px;
    color:#fff;
    font-weight:bold;
    font-size:13px;
    text-shadow:1px 1px 1px rgba(0,0,0,.5);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .titlebar-icon{
    width:16px; height:16px;
    background:
      linear-gradient(135deg, var(--x-color) 0 50%, var(--o-color) 50% 100%);
    border-radius:3px;
    box-shadow:0 0 0 1px rgba(255,255,255,.6) inset;
    flex-shrink:0;
  }

  .titlebar-btns{
    display:flex;
    gap:2px;
  }

  .tbtn{
    width:21px; height:21px;
    border-radius:3px;
    border:1px solid rgba(255,255,255,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    color:#fff;
    cursor:default;
    background:linear-gradient(180deg, #4f95ec, #1962d6);
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
  }
  .tbtn.close{ background:linear-gradient(180deg, #f19c8f, #d4372a); }

  .menubar{
    background:var(--window-bg);
    border-bottom:1px solid #b8b59c;
    padding:3px 8px;
    display:flex;
    gap:14px;
    font-size:11px;
  }
  .menubar span{ padding:2px 4px; }
  .menubar span:hover{ background:#316ac5; color:#fff; border-radius:2px; }

  .window-body{
    padding:14px;
  }

  .banner{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel-bg);
    border:1px solid var(--border-dark);
    border-radius:4px;
    padding:8px 10px;
    margin-bottom:12px;
    box-shadow: 1px 1px 0 #fff inset;
  }

  .banner-icon{
    width:32px;height:32px;
    flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #fff8c9, #ffd83d 55%, #e0a400 100%);
    border-radius:50%;
    border:1px solid #a97b00;
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;
    font-size:18px;
    color:#7a4a00;
  }

  .banner h1{
    margin:0;
    font-size:13px;
    font-weight:bold;
  }
  .banner p{
    margin:2px 0 0;
    font-size:11px;
    color:#3a3a3a;
  }

  /* ===== HUD (score panel, sunken like classic XP inputs) ===== */
  .hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--field-bg);
    border:1px solid var(--border-darker);
    box-shadow: inset 1px 1px 2px rgba(0,0,0,.35);
    border-radius:3px;
    padding:6px 10px;
    margin-bottom:10px;
    font-size:11px;
  }
  .hud .item{ text-align:center; }
  .hud b{ display:block; font-size:16px; }
  .hud .you b{ color:var(--o-color); }
  .hud .bot b{ color:var(--x-color); }
  .hud .empates b{ color:#555; }

  #status{
    text-align:center;
    font-weight:bold;
    font-size:12px;
    color:var(--xp-blue-dark);
    min-height:18px;
    margin-bottom:10px;
  }

  /* ===== Board ===== */
  .board-wrap{
    position:relative;
    display:flex;
    justify-content:center;
  }

  #board{
    display:grid;
    grid-template-columns:repeat(3,84px);
    grid-template-rows:repeat(3,84px);
    gap:4px;
    background:var(--border-darker);
    padding:4px;
    border:2px solid var(--border-darker);
    border-radius:3px;
    box-shadow: inset 1px 1px 3px rgba(0,0,0,.4);
  }

  .cell{
    background:linear-gradient(180deg, #ffffff 0%, #eceada 100%);
    border:1px solid #a8a68e;
    border-top-color:#fff;
    border-left-color:#fff;
    border-radius:2px;
    font-size:42px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#000;
    font-family: Tahoma, sans-serif;
    box-shadow:
      1px 1px 0 #fff inset,
      -1px -1px 0 #8a8a6f inset;
    transition:background .12s ease;
  }

  .cell:not(.filled):hover{
    background:linear-gradient(180deg, #fffce0 0%, #fdf3b2 100%);
  }
  .cell:not(.filled):active{
    box-shadow: inset 1px 1px 3px rgba(0,0,0,.4);
  }

  .cell.filled{ cursor:default; }
  .cell.x{ color:var(--x-color); text-shadow:1px 1px 0 rgba(0,0,0,.15); }
  .cell.o{ color:var(--o-color); text-shadow:1px 1px 0 rgba(0,0,0,.15); }

  .cell.pop{ animation:pop .2s ease; }
  @keyframes pop{
    0%{ transform:scale(.4); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }

  .cell.win{
    background:linear-gradient(180deg, #fff4a3, #ffd83d);
  }

  /* ===== Speech bubble - estilo balão de dica clássico (tooltip amarelo) ===== */
  .bubble{
    position:absolute;
    top:-10px;
    right:-238px;
    max-width:220px;
    background:var(--tooltip-bg);
    color:#000;
    padding:10px 12px;
    border:1px solid #000;
    box-shadow:2px 2px 4px rgba(0,0,0,.4);
    font-size:12px;
    line-height:1.35;
    opacity:0;
    transform:translateY(8px) scale(.9);
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
    z-index:5;
  }
  .bubble::before{
    content:"💬";
    display:block;
    font-size:11px;
    margin-bottom:3px;
  }
  .bubble::after{
    content:"";
    position:absolute;
    left:-9px;
    bottom:16px;
    width:0;height:0;
    border-style:solid;
    border-width:7px 9px 7px 0;
    border-color:transparent #000 transparent transparent;
  }
  .bubble.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  @media (max-width:640px){
    #board{
      grid-template-columns:repeat(3,76px);
      grid-template-rows:repeat(3,76px);
    }
    .cell{ font-size:36px; }
    .bubble{
      right:50%;
      top:-92px;
      transform:translateX(50%) translateY(-10px) scale(.9);
    }
    .bubble::after{
      left:50%;
      bottom:-8px;
      transform:translateX(-50%) rotate(90deg);
    }
    .bubble.show{
      transform:translateX(50%) translateY(0) scale(1);
    }
  }

  .controls{
    display:flex;
    justify-content:center;
    margin-top:14px;
  }

  button.xp-btn{
    font-family:Tahoma, sans-serif;
    font-size:11px;
    background:linear-gradient(180deg, #fefefe 0%, #ece9d8 45%, #d9d6c3 50%, #ece9d8 100%);
    border:1px solid #8a8a6f;
    border-radius:3px;
    padding:6px 16px;
    cursor:pointer;
    box-shadow:1px 1px 0 #fff inset;
  }
  button.xp-btn:hover{
    border-color:var(--titlebar-1);
    background:linear-gradient(180deg, #fffbe8 0%, #fff0b0 50%, #ffe485 51%, #fff0b0 100%);
  }
  button.xp-btn:active{
    box-shadow: inset 1px 1px 2px rgba(0,0,0,.3);
  }

  .statusbar{
    border-top:1px solid #b8b59c;
    background:var(--window-bg);
    padding:4px 10px;
    font-size:10px;
    color:#444;
    display:flex;
    justify-content:space-between;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="xp-window">

    <div class="titlebar">
      <div class="titlebar-left">
        <div class="titlebar-icon"></div>
        <span>JogoDaVelha.exe - Impossível e Debochado</span>
      </div>
      <div class="titlebar-btns">
        <div class="tbtn">_</div>
        <div class="tbtn">□</div>
        <div class="tbtn close">×</div>
      </div>
    </div>

    <div class="menubar">
      <span>Arquivo</span>
      <span>Editar</span>
      <span>Jogo</span>
      <span>Ajuda</span>
    </div>

    <div class="window-body">

      <div class="banner">
        <div class="banner-icon">!</div>
        <div>
          <h1>Jogo da Velha Impossível</h1>
          <p>Você é o <b style="color:var(--o-color)">O</b>, o PC é o <b style="color:var(--x-color)">X</b>. A IA nunca perde — e faz questão de te lembrar disso.</p>
        </div>
      </div>

      <div class="hud">
        <div class="item you">Você<b id="scoreYou">0</b></div>
        <div class="item empates">Empates<b id="scoreDraw">0</b></div>
        <div class="item bot">PC<b id="scoreBot">0</b></div>
      </div>

      <div id="status">Sua vez. Aproveite enquanto dura.</div>

      <div class="board-wrap">
        <div id="board"></div>
        <div class="bubble" id="bubble"></div>
      </div>

      <div class="controls">
        <button class="xp-btn" id="resetBtn">Novo Jogo</button>
      </div>

    </div>

    <div class="statusbar">
      <span>Pronto</span>
      <span>Motor: Minimax v1.0</span>
    </div>

  </div>
</div>

<script>
(function(){
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const bubbleEl = document.getElementById('bubble');
  const resetBtn = document.getElementById('resetBtn');
  const scoreYouEl = document.getElementById('scoreYou');
  const scoreBotEl = document.getElementById('scoreBot');
  const scoreDrawEl = document.getElementById('scoreDraw');

  const HUMAN = 'O';
  const BOT = 'X';

  let board = Array(9).fill(null);
  let gameOver = false;
  let score = { you: 0, bot: 0, draw: 0 };

  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const blockTaunts = [
    "Sério que você achou que ia ganhar?",
    "Minha avó com Alzheimer joga melhor",
    "Desista, o fracasso combina com você",
    "Ah não, essa jogada quase me assustou. Quase.",
    "Bloqueado. Como sempre.",
    "Você tenta, eu bloqueio. Padrão da casa.",
    "Isso era pra ser uma armadilha?",
    "Fofo você achando que eu não via isso vindo",
    "Nem em outra vida, campeão(ã)"
  ];

  const attackTaunts = [
    "Prepare-se pra sofrer",
    "Essa aqui é só pra te deixar nervoso(a)",
    "Cheiro de derrota no ar",
    "To só brincando com você agora",
    "Erro de sistema: sua vitória não foi encontrada",
    "Relaxa, tá quase acabando o seu sofrimento"
  ];

  const winTaunts = [
    "GG. Literalmente Game Given por mim.",
    "Eu avisei. Várias vezes.",
    "Bota isso na sua lápide: 'nunca venceu o PC'",
    "Foi mal, mas não foi mal",
    "Isso foi constrangedor pra você, né?"
  ];

  const drawTaunts = [
    "Empate?! Isso é uma vitória disfarçada de fracasso pra você.",
    "Nem eu, nem você. Mas confia, eu deixei.",
    "Empatou porque eu quis. Só isso."
  ];

  function renderBoard(){
    boardEl.innerHTML = '';
    board.forEach((val, i) => {
      const cell = document.createElement('button');
      cell.className = 'cell' + (val ? ' filled ' + val.toLowerCase() : '');
      cell.textContent = val || '';
      cell.dataset.index = i;
      cell.addEventListener('click', () => handleHumanMove(i));
      boardEl.appendChild(cell);
    });
  }

  function checkWinner(b){
    for (const [a,b1,c] of WINS){
      if (b[a] && b[a] === b[b1] && b[a] === b[c]){
        return { winner: b[a], line: [a,b1,c] };
      }
    }
    if (b.every(v => v)) return { winner: 'draw', line: [] };
    return null;
  }

  function minimax(b, player){
    const result = checkWinner(b);
    if (result){
      if (result.winner === BOT) return { score: 10 };
      if (result.winner === HUMAN) return { score: -10 };
      return { score: 0 };
    }

    const moves = [];
    for (let i = 0; i < 9; i++){
      if (!b[i]){
        const newBoard = b.slice();
        newBoard[i] = player;
        const res = minimax(newBoard, player === BOT ? HUMAN : BOT);
        moves.push({ index: i, score: res.score });
      }
    }

    if (player === BOT){
      let best = moves[0];
      for (const m of moves) if (m.score > best.score) best = m;
      return best;
    } else {
      let best = moves[0];
      for (const m of moves) if (m.score < best.score) best = m;
      return best;
    }
  }

  function botMove(){
    const best = minimax(board, BOT);
    if (best && best.index !== undefined){
      board[best.index] = BOT;
      renderBoard();
      animateCell(best.index);

      const result = checkWinner(board);
      if (result){
        finishGame(result);
        return;
      }

      const wasBlock = wasBlockingMove(best.index);
      showBubble(wasBlock ? pick(blockTaunts) : pick(attackTaunts));
      statusEl.textContent = 'Sua vez de novo. Boa sorte com isso.';
    }
  }

  function wasBlockingMove(index){
    const test = board.slice();
    test[index] = HUMAN;
    const r = checkWinner(test);
    return r && r.winner === HUMAN;
  }

  function animateCell(index){
    const cellEl = boardEl.children[index];
    if (cellEl){
      cellEl.classList.add('pop');
      setTimeout(() => cellEl.classList.remove('pop'), 200);
    }
  }

  function handleHumanMove(index){
    if (gameOver || board[index]) return;
    board[index] = HUMAN;
    renderBoard();
    animateCell(index);
    hideBubble();

    const result = checkWinner(board);
    if (result){
      finishGame(result);
      return;
    }

    statusEl.textContent = 'Processando sua derrota...';
    setTimeout(botMove, 500);
  }

  function finishGame(result){
    gameOver = true;
    if (result.winner === 'draw'){
      statusEl.textContent = 'Empate.';
      showBubble(pick(drawTaunts));
      score.draw++;
      scoreDrawEl.textContent = score.draw;
    } else {
      highlightWin(result.line);
      if (result.winner === BOT){
        statusEl.textContent = 'O PC venceu. De novo. Surpresa.';
        showBubble(pick(winTaunts));
        score.bot++;
        scoreBotEl.textContent = score.bot;
      } else {
        statusEl.textContent = 'Uau. Isso não deveria ter acontecido.';
        showBubble("Ok, isso foi bug, não habilidade sua.");
        score.you++;
        scoreYouEl.textContent = score.you;
      }
    }
  }

  function highlightWin(line){
    line.forEach(i => {
      const cellEl = boardEl.children[i];
      if (cellEl) cellEl.classList.add('win');
    });
  }

  function showBubble(text){
    bubbleEl.textContent = text;
    bubbleEl.classList.remove('show');
    void bubbleEl.offsetWidth;
    bubbleEl.classList.add('show');
  }

  function hideBubble(){
    bubbleEl.classList.remove('show');
  }

  function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function resetGame(){
    board = Array(9).fill(null);
    gameOver = false;
    hideBubble();
    renderBoard();
    statusEl.textContent = 'Sua vez. Aproveite enquanto dura.';
  }

  resetBtn.addEventListener('click', resetGame);

  renderBoard();
})();
</script>

</body>
</html>
